name: Mise à jour des séances

on:
  schedule:
    - cron: "0 8 * * *"    # chaque jour à 5h, heure de Rio
    - cron: "0 17 * * *"   # et à 14h, pour les séances ajoutées dans la journée
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 scripts/scrape.py
      - name: Enregistrer les nouvelles séances
        run: |
          git config user.name "cine-rio-bot"
          git config user.email "actions@users.noreply.github.com"
          git add site/data
          git diff --cached --quiet || git commit -m "Séances du $(date -u +%F)"
          # si le code a changé entre-temps, on se replace dessus avant d'envoyer
          git pull --rebase origin main
          git push
